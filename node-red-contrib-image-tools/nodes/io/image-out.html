<script type="text/javascript">
    RED.nodes.registerType('rp-image-out', {
        category: 'RP Image',
        color: '#A6C8A6',
        defaults: {
            name: { value: "" },
            mode: { value: "single" },
            folderPath: { value: "" },
            folderPathType: { value: "str" },
            filenamePrefix: { value: "" },
            filenamePrefixType: { value: "str" },
            filenameFull: { value: "" },
            filenameFullType: { value: "str" },
            inputPath: { value: "payload" },
            inputPathType: { value: "msg" },
            saveConfig: { value: "payload" },
            saveConfigType: { value: "msg" },
            imageField: { value: "bitmap" },
            filenameField: { value: "filename" },
            filenameFieldType: { value: "item" },
            outputDirField: { value: "outputDir" },
            outputDirFieldType: { value: "item" },
            outputFormat: { value: "jpg" },
            outputQuality: { value: 90 },
            pngCompression: { value: 8 },
            webpLossless: { value: false },
            webpEffort: { value: "" },
            webpSmartSubsample: { value: false },
            overwriteProtection: { value: true },
            maxImages: { value: "" },
            maxImagesType: { value: "num" },
            diskThreshold: { value: 90 },
            active: { value: true },
            debugEnabled: { value: false },
            debugWidth: { value: 200 },
            debugWidthType: { value: "num" }
        },
        inputs: 1,
        outputs: 0,
        align: "right",
        icon: "font-awesome/fa-save",
        label: function() {
            return this.name || "image out";
        },
        button: {
            toggle: "active",
            visible: function() { return true; },
            onclick: function() {
                var node = this;
                var label = RED.utils.sanitize(this.name || "rp-image-out");
                var desiredState = node.active;

                sendToggleRequest(node, desiredState, function() {
                    var historyEvent = {
                        t: 'edit',
                        node: node,
                        changes: {
                            active: !node.active
                        },
                        dirty: node.dirty,
                        changed: node.changed,
                        callback: function(ev) {
                            sendToggleRequest(ev.node, ev.node.active);
                        }
                    };

                    node.changed = true;
                    node.dirty = true;
                    RED.nodes.dirty(true);
                    RED.history.push(historyEvent);
                    RED.view.redraw();

                    RED.notify(label + " " + (desiredState ? "activated" : "deactivated"), "success");
                }, function(jqXHR, textStatus, errorThrown) {
                    node.active = !node.active;
                    RED.view.redraw();
                    if (jqXHR && jqXHR.status === 404) {
                        RED.notify("Node not deployed", "error");
                    } else if (errorThrown) {
                        RED.notify("Error: " + errorThrown, "error");
                    } else {
                        RED.notify("Unexpected error", "error");
                    }
                });
            }
        },
        oneditprepare: function() {
            // Mode toggle
            function toggleMode() {
                var isMultiple = $('#node-input-mode').val() === 'multiple';
                if (isMultiple) {
                    $('.imageout-single-mode').hide();
                    $('.imageout-multiple-mode').show();
                } else {
                    $('.imageout-single-mode').show();
                    $('.imageout-multiple-mode').hide();
                }
            }
            $('#node-input-mode').change(toggleMode);
            toggleMode();

            // Item field custom type for typedInputs
            var itemFieldType = {
                value: 'item',
                label: 'Item field',
                icon: 'red/images/typedInput/json.svg'
            };

            // Initialize TypedInput for folder path
            $("#node-input-folderPath").typedInput({
                default: 'str',
                types: ['str', 'msg', 'flow', 'global'],
                typeField: "#node-input-folderPathType"
            });

            var jsonataTypeOption = {
                value: 'jsonata',
                label: 'JSONata',
                icon: 'red/images/typedInput/expr.svg'
            };
            var nameTypes = ['str', 'msg', 'flow', 'global', jsonataTypeOption];

            // Initialize TypedInput for filename prefix
            $("#node-input-filenamePrefix").typedInput({
                default: 'str',
                types: nameTypes,
                typeField: "#node-input-filenamePrefixType"
            });

            // Initialize TypedInput for full filename
            $("#node-input-filenameFull").typedInput({
                default: 'str',
                types: nameTypes,
                typeField: "#node-input-filenameFullType"
            });

            // Initialize TypedInput for input path
            $("#node-input-inputPath").typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: "#node-input-inputPathType"
            });

            // Multiple mode TypedInputs
            $("#node-input-saveConfig").typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: "#node-input-saveConfigType"
            });

            $("#node-input-filenameField").typedInput({
                default: 'item',
                types: [itemFieldType, 'str', 'msg', 'flow', 'global'],
                typeField: "#node-input-filenameFieldType"
            });

            $("#node-input-outputDirField").typedInput({
                default: 'item',
                types: [itemFieldType, 'str', 'msg', 'flow', 'global'],
                typeField: "#node-input-outputDirFieldType"
            });

            // Initialize TypedInput for maximum images
            $("#node-input-maxImages").typedInput({
                default: 'num',
                types: ['num', 'msg', 'flow', 'global'],
                typeField: "#node-input-maxImagesType"
            });

            // Initialize debug width TypedInput
            $("#node-input-debugWidth").typedInput({
                default: 'num',
                types: ['num', 'msg', 'flow', 'global'],
                typeField: "#node-input-debugWidthType"
            });

            // Show/hide quality row based on format
            function updateQualityVisibility() {
                var format = $('#node-input-outputFormat').val();
                var qualityRow = $('#quality-row');
                var pngCompressionRow = $('#png-compression-row');
                var webpLosslessRow = $('#webp-lossless-row');
                var webpEffortRow = $('#webp-effort-row');
                var webpSmartSubsampleRow = $('#webp-smartsubsample-row');

                if (format === 'jpg') {
                    qualityRow.show();
                    pngCompressionRow.hide();
                    webpLosslessRow.hide();
                    webpEffortRow.hide();
                    webpSmartSubsampleRow.hide();
                } else if (format === 'webp') {
                    qualityRow.show();
                    pngCompressionRow.hide();
                    webpLosslessRow.show();
                    webpEffortRow.show();
                    webpSmartSubsampleRow.show();
                } else if (format === 'png') {
                    qualityRow.hide();
                    pngCompressionRow.show();
                    webpLosslessRow.hide();
                    webpEffortRow.hide();
                    webpSmartSubsampleRow.hide();
                } else {
                    qualityRow.hide();
                    pngCompressionRow.hide();
                    webpLosslessRow.hide();
                    webpEffortRow.hide();
                    webpSmartSubsampleRow.hide();
                }
            }

            $('#node-input-outputFormat').change(updateQualityVisibility);
            updateQualityVisibility();

            // Debug checkbox logic
            var debugCheckbox = $('#node-input-debugEnabled');
            var debugWidthRow = $('#debug-width-row');

            function updateDebugWidthVisibility() {
                if (debugCheckbox.prop('checked')) {
                    debugWidthRow.show();
                } else {
                    debugWidthRow.hide();
                }
            }

            debugCheckbox.change(updateDebugWidthVisibility);
            updateDebugWidthVisibility();

            // Initialize debug image display
            initDebugImageDisplay();
        }
    });

    function sendToggleRequest(node, active, onSuccess, onError) {
        $.ajax({
            url: "image-out/" + node.id,
            type: "POST",
            data: JSON.stringify({ active: active }),
            contentType: "application/json; charset=utf-8",
            success: function(resp) {
                if (typeof onSuccess === 'function') {
                    onSuccess(resp);
                }
            },
            error: function(jqXHR, textStatus, errorThrown) {
                if (typeof onError === 'function') {
                    onError(jqXHR, textStatus, errorThrown);
                }
            }
        });
    }

    // Debug image display functionality
    function initDebugImageDisplay() {
        (function() {
            var isSubscribed = false;

            function subscribeToDebugImages() {
                if (isSubscribed || typeof RED === 'undefined' || !RED.comms) return;
                isSubscribed = true;

                RED.comms.subscribe('debug-image', function(event, data) {
                    if (!data || !data.id) return;

                    try {
                        renderDebugImage(data);
                    } catch (err) {
                        console.warn('Debug image render error:', err);
                    }
                });
            }

            function renderDebugImage(data) {
                var nodeId = data.id;
                var base64Data = data.data;
                var format = data.format || 'unknown';
                var mimeType = data.mimeType || 'jpeg';

                if (!base64Data) {
                    removeDebugImage(nodeId);
                    return;
                }

                var nodeElement = document.getElementById(nodeId);
                if (!nodeElement) return;

                var debugContainer = document.getElementById('debug-img-container-' + nodeId);

                if (!debugContainer) {
                    debugContainer = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
                    debugContainer.id = 'debug-img-container-' + nodeId;
                    debugContainer.setAttribute('x', '70');
                    debugContainer.setAttribute('y', '5');
                    debugContainer.setAttribute('width', '120');
                    debugContainer.setAttribute('height', '120');
                    debugContainer.style.overflow = 'visible';

                    var img = document.createElement('img');
                    img.id = 'debug-img-' + nodeId;
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.style.display = 'block';
                    img.style.cursor = 'pointer';
                    img.style.maxHeight = '100px';
                    img.style.maxWidth = '100px';

                    img.onclick = function() {
                        removeDebugImage(nodeId);
                    };

                    debugContainer.appendChild(img);
                    nodeElement.appendChild(debugContainer);
                }

                var imgEl = document.getElementById('debug-img-' + nodeId);

                if (imgEl) {
                    imgEl.src = 'data:image/' + mimeType + ';base64,' + base64Data;
                    imgEl.title = 'Debug image (click to hide)';
                }
            }

            function removeDebugImage(nodeId) {
                var debugContainer = document.getElementById('debug-img-container-' + nodeId);
                if (debugContainer) {
                    debugContainer.remove();
                }
            }

            function initializeWhenReady() {
                if (typeof RED !== 'undefined' && RED.comms) {
                    subscribeToDebugImages();

                    setInterval(function() {
                        var debugContainers = document.querySelectorAll('[id^="debug-img-container-"]');
                        debugContainers.forEach(function(container) {
                            var nodeId = container.id.replace('debug-img-container-', '');
                            var nodeElement = document.getElementById(nodeId);
                            if (!nodeElement) {
                                container.remove();
                            }
                        });
                    }, 5000);
                } else {
                    setTimeout(initializeWhenReady, 100);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializeWhenReady);
            } else {
                initializeWhenReady();
            }
        })();
    }
</script>

<script type="text/x-red" data-template-name="rp-image-out">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

    <hr>

    <!-- Mode Selection -->
    <div class="form-row">
        <label for="node-input-mode"><i class="fa fa-list"></i> Mode</label>
        <select id="node-input-mode" style="width: 200px;">
            <option value="single">Single image</option>
            <option value="multiple">Multiple images</option>
        </select>
    </div>

    <!-- Single Mode Fields -->
    <div class="imageout-single-mode">
        <div class="form-row">
            <label for="node-input-folderPath"><i class="fa fa-folder"></i> Folder Path</label>
            <input type="text" id="node-input-folderPath" style="width: 70%;" placeholder="/path/to/save/folder">
            <input type="hidden" id="node-input-folderPathType">
        </div>

        <div class="form-row">
            <label for="node-input-filenamePrefix"><i class="fa fa-tag"></i> Filename Prefix</label>
            <input type="text" id="node-input-filenamePrefix" style="width: 70%;" placeholder="image (optional)">
            <input type="hidden" id="node-input-filenamePrefixType">
            <div style="margin-left: 106px; margin-top: 4px; color: #666; font-size: 12px;">
                Pattern: [prefix]_YYYYMMDD_HHMMSS.[ext]
            </div>
        </div>

        <div class="form-row">
            <label for="node-input-filenameFull"><i class="fa fa-file-text-o"></i> Full Filename</label>
            <input type="text" id="node-input-filenameFull" style="width: 70%;" placeholder="photo.jpg (optional)">
            <input type="hidden" id="node-input-filenameFullType">
            <div style="margin-left: 106px; margin-top: 4px; color: #666; font-size: 12px;">
                Overrides prefix & timestamp when provided. Leave blank for automatic naming.
            </div>
        </div>

        <hr>

        <div class="form-row">
            <label for="node-input-inputPath"><i class="fa fa-sign-in"></i> Input from</label>
            <input type="text" id="node-input-inputPath" style="width: 70%;">
            <input type="hidden" id="node-input-inputPathType">
        </div>
    </div>

    <!-- Multiple Mode Fields -->
    <div class="imageout-multiple-mode" style="display: none;">
        <div class="form-row">
            <label for="node-input-saveConfig"><i class="fa fa-sign-in"></i> Input</label>
            <input type="text" id="node-input-saveConfig" style="width: 70%;">
            <input type="hidden" id="node-input-saveConfigType">
            <div style="margin-left: 106px; margin-top: 4px; color: #666; font-size: 12px;">
                Array of objects, each containing an image and optional filename/folder.
            </div>
        </div>

        <div class="form-row">
            <label for="node-input-imageField"><i class="fa fa-picture-o"></i> Image field</label>
            <input type="text" id="node-input-imageField" placeholder="bitmap" style="width: 200px;">
            <div style="margin-left: 106px; margin-top: 4px; color: #666; font-size: 12px;">
                Key name holding the image data in each object.
            </div>
        </div>

        <div class="form-row">
            <label for="node-input-outputDirField"><i class="fa fa-folder"></i> Output dir</label>
            <input type="text" id="node-input-outputDirField" style="width: 70%;">
            <input type="hidden" id="node-input-outputDirFieldType">
        </div>

        <div class="form-row">
            <label for="node-input-filenameField"><i class="fa fa-file-text-o"></i> Filename</label>
            <input type="text" id="node-input-filenameField" style="width: 70%;">
            <input type="hidden" id="node-input-filenameFieldType">
        </div>
    </div>

    <hr>

    <!-- Output Format Configuration (shared) -->
    <div class="form-row">
        <label for="node-input-outputFormat"><i class="fa fa-file-image-o"></i> Output Format</label>
        <select id="node-input-outputFormat" style="width: 200px;">
            <option value="jpg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
            <option value="bmp">BMP</option>
        </select>
    </div>

    <div class="form-row" id="quality-row">
        <label for="node-input-outputQuality"><i class="fa fa-sliders"></i> Quality</label>
        <input type="number" id="node-input-outputQuality" min="1" max="100" value="90" style="width: 70px;">
        <span style="margin-left: 10px; color: #666;">1-100 (JPEG/WebP only)</span>
    </div>

    <div class="form-row" id="png-compression-row" style="display: none;">
        <label for="node-input-pngCompression"><i class="fa fa-leaf"></i> Compression</label>
        <input type="number" id="node-input-pngCompression" min="0" max="9" step="1" style="width: 70px;">
        <span style="margin-left: 10px; color: #666;">0-9 (higher = smaller file, slower)</span>
    </div>

    <div class="form-row" id="webp-lossless-row" style="display: none;">
        <label for="node-input-webpLossless"><i class="fa fa-lock"></i> WebP Lossless</label>
        <input type="checkbox" id="node-input-webpLossless" style="display:inline-block; width:auto; vertical-align:baseline;">
        <label for="node-input-webpLossless" style="width:auto; margin-left:5px;">Encode WebP without loss</label>
    </div>

    <div class="form-row" id="webp-smartsubsample-row" style="display: none;">
        <label for="node-input-webpSmartSubsample"><i class="fa fa-magic"></i> WebP Smart Subsample</label>
        <input type="checkbox" id="node-input-webpSmartSubsample" style="display:inline-block; width:auto; vertical-align:baseline;">
        <label for="node-input-webpSmartSubsample" style="width:auto; margin-left:5px;">Improve chroma downsampling (lossy WebP only)</label>
    </div>

    <div class="form-row" id="webp-effort-row" style="display: none;">
        <label for="node-input-webpEffort"><i class="fa fa-tachometer"></i> WebP Effort</label>
        <input type="number" id="node-input-webpEffort" min="0" max="6" placeholder="4" style="width: 70px;">
        <span style="margin-left: 10px; color: #666;">0-6 (higher = smaller file, slower)</span>
    </div>

    <hr>

    <!-- Protection Settings (shared) -->
    <div class="form-row">
        <label for="node-input-overwriteProtection"><i class="fa fa-shield"></i> Protection</label>
        <input type="checkbox" id="node-input-overwriteProtection" style="display:inline-block; width:auto; vertical-align:baseline;" checked>
        <label for="node-input-overwriteProtection" style="width:auto; margin-left:5px;">Prevent overwriting existing files (_2, _3, etc.)</label>
    </div>

    <div class="form-row">
        <label for="node-input-maxImages"><i class="fa fa-list-ol"></i> Max Images</label>
        <input type="text" id="node-input-maxImages" style="width: 120px;" placeholder="0">
        <input type="hidden" id="node-input-maxImagesType">
        <span style="margin-left: 10px; color: #666;">0 or blank keeps all files.</span>
    </div>

    <div class="form-row">
        <label for="node-input-diskThreshold"><i class="fa fa-hdd-o"></i> Disk Limit</label>
        <input type="number" id="node-input-diskThreshold" min="0" max="100" step="1" style="width: 70px;">
        <span style="margin-left: 10px; color: #666;">% full — skip saving above this. 0 disables check.</span>
    </div>

    <!-- Debug Configuration -->
    <div class="form-row">
        <label for="node-input-debugEnabled"><i class="fa fa-bug"></i> Debug</label>
        <input type="checkbox" id="node-input-debugEnabled" style="display:inline-block; width:auto; vertical-align:baseline;">
        <label for="node-input-debugEnabled" style="width:auto; margin-left:5px;">Show saved image preview</label>
    </div>

    <div class="form-row" id="debug-width-row" style="display: none;">
        <label for="node-input-debugWidth"><i class="fa fa-arrows-h"></i> Debug Width</label>
        <input type="text" id="node-input-debugWidth" style="width: 120px;">
        <input type="hidden" id="node-input-debugWidthType">
    </div>
</script>

<script type="text/x-red" data-help-name="rp-image-out">
    <p>Saves images to the filesystem with automatic timestamp-based naming and optional overwrite protection.</p>

    <h3>Details</h3>
    <p>This node saves image data to disk with automatic timestamp naming to ensure unique filenames. It includes an enable/disable button (similar to the debug node) that allows you to control whether images are saved without modifying your flow.</p>

    <h3>Mode</h3>
    <dl class="message-properties">
        <dt>Single image</dt>
        <dd>Saves one image per message using the configured input path, folder, and filename settings.</dd>
        <dt>Multiple images</dt>
        <dd>Accepts an array of objects (e.g., from a batch pipeline). Each object contains an image and optionally a filename and output directory. Saves are processed sequentially to ensure correct overwrite protection and max-images enforcement.</dd>
    </dl>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Folder Path <span class="property-type">string | msg | flow | global</span></dt>
        <dd>(Single mode) The directory where images will be saved. Created automatically if missing.</dd>

        <dt>Filename Prefix <span class="property-type">string | msg | flow | global | JSONata</span></dt>
        <dd>(Single mode) Optional prefix for the auto-generated filename. Defaults to <code>image</code>. Pattern: <code>[prefix]_YYYYMMDD_HHMMSS.[ext]</code>.</dd>

        <dt>Full Filename <span class="property-type">string | msg | flow | global | JSONata</span></dt>
        <dd>(Single mode) Overrides prefix & timestamp with an explicit name. If the extension is provided (jpg/png/webp/bmp), the output format adjusts accordingly.</dd>

        <dt>Input from <span class="property-type">msg | flow | global</span></dt>
        <dd>(Single mode) Location of the image data to save. Defaults to <code>msg.payload</code>.</dd>

        <dt>Input <span class="property-type">msg | flow | global</span></dt>
        <dd>(Multiple mode) Array of objects to iterate. Defaults to <code>msg.payload</code>.</dd>

        <dt>Image field <span class="property-type">string</span></dt>
        <dd>(Multiple mode) Key name in each object holding the image data. Defaults to <code>bitmap</code>.</dd>

        <dt>Output dir <span class="property-type">item field | str | msg | flow | global</span></dt>
        <dd>(Multiple mode) Per-item folder from a key in each object, or a shared value for all items. Defaults to reading <code>outputDir</code> from each item.</dd>

        <dt>Filename <span class="property-type">item field | str | msg | flow | global</span></dt>
        <dd>(Multiple mode) Per-item filename from a key in each object, or a shared value. When blank, a timestamped name is generated. Defaults to reading <code>filename</code> from each item.</dd>

        <dt>Output Format <span class="property-type">select</span></dt>
        <dd>Image format: JPEG, PNG, WebP, or BMP.</dd>

        <dt>Quality <span class="property-type">number</span></dt>
        <dd>Quality for JPEG and WebP (1-100).</dd>

        <dt>PNG Compression <span class="property-type">number</span></dt>
        <dd>PNG compression level (0-9). Higher = smaller file, slower.</dd>

        <dt>WebP Lossless <span class="property-type">boolean</span></dt>
        <dd>Lossless WebP encoding (ignores quality slider).</dd>

        <dt>WebP Effort <span class="property-type">number</span></dt>
        <dd>Encoder effort 0-6 for WebP.</dd>

        <dt>WebP Smart Subsample <span class="property-type">boolean</span></dt>
        <dd>Smarter chroma downsampling for lossy WebP.</dd>

        <dt>Overwrite Protection <span class="property-type">boolean</span></dt>
        <dd>Appends <code>_2</code>, <code>_3</code>, etc. if a file already exists.</dd>

        <dt>Max Images <span class="property-type">number | msg | flow | global</span></dt>
        <dd>FIFO retention: deletes oldest files to keep at most this many.</dd>

        <dt>Disk Limit <span class="property-type">number</span></dt>
        <dd>Percentage of disk usage above which saving is skipped (default 90). Set to 0 to disable the check.</dd>

        <dt>Active Button <span class="property-type">button</span></dt>
        <dd>Enable/disable saving without modifying the flow.</dd>
    </dl>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>Image Object <span class="property-type">object</span></dt>
        <dd>Standard image structure with properties: data (Buffer), width, height, channels, colorSpace, dtype. Or an encoded Buffer (JPEG/PNG/WebP).</dd>
    </dl>

    <h3>Status Indicators</h3>
    <ul>
        <li><strong>Gray dot "inactive":</strong> Node is disabled via button</li>
        <li><strong>Blue dot "saving...":</strong> Currently writing file(s) to disk</li>
        <li><strong>Green dot "saved: ...":</strong> Successfully saved (shows filename or count)</li>
        <li><strong>Red dot "Error":</strong> Save failed (check debug panel)</li>
    </ul>
</script>
