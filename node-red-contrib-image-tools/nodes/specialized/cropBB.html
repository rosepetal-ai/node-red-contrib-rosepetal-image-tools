<!-- 1 ▸ Runtime registration -->
<script type="text/javascript">
  RED.nodes.registerType('rp-cropBB',{
  
    category:'RP Image',
    color   :'#FF6B35',  // Distinct orange color to differentiate from standard pink
    icon    :'font-awesome/fa-scissors',
  
    defaults:{
      name:{value:""},
      imageInputPath:{value:"image"},   imageInputPathType:{value:"msg"},
      bboxInputPath:{value:"default"},  bboxInputPathType:{value:"msg"},
      outputPath:{value:"payload"},  outputPathType:{value:"msg"},
      outputFormat:{value:"raw"},
      outputQuality:{value:90},
      pngOptimize:{value:false},
      webpLossless:{value:false},
      webpSmartSubsample:{value:false},
      webpEffort:{value:""},

      // Filtering options
      minConfidence:{value:0.5},
      minConfidenceType:{value:"num"},
      
      // Debug configuration
      debugEnabled:{value:false},
      debugWidth:{value:200},
      debugWidthType:{value:"num"}
    },
  
    inputs:1, outputs:1,
    label:function(){ return this.name || "rp-cropBB"; },
  
    /* ---------------- oneditprepare ---------------- */
    oneditprepare:function(){
  
      /* I/O typedInputs */
      $("#node-input-imageInputPath").typedInput({
        default:'msg',types:['msg','flow','global'],
        typeField:"#node-input-imageInputPathType"
      });
      
      $("#node-input-bboxInputPath").typedInput({
        default:'msg',types:['msg','flow','global'],
        typeField:"#node-input-bboxInputPathType"
      });
      
      $("#node-input-outputPath").typedInput({
        default:'msg',types:['msg','flow','global'],
        typeField:"#node-input-outputPathType"
      });

      /* confidence threshold */
      $("#node-input-minConfidence").typedInput({
        default:'num',
        types:['num','msg','flow','global'],
        typeField:"#node-input-minConfidenceType"
      });

      /* debug width */
      $("#node-input-debugWidth").typedInput({
        default:'num',
        types:['num','msg','flow','global'],
        typeField:"#node-input-debugWidthType"
      });

      /* Quality visibility logic */
      function updateQualityVisibility() {
        const format = $('#node-input-outputFormat').val();
        if (format === 'jpg' || format === 'webp') {
          $('#quality-row').show();
        } else {
          $('#quality-row').hide();
        }
        $('#png-optimize-row').toggle(format === 'png');
        // Show WebP advanced options only when WebP is selected
        const isWebp = format === 'webp';
        $('#webp-lossless-row').toggle(isWebp);
        $('#webp-smartsubsample-row').toggle(isWebp);
        $('#webp-effort-row').toggle(isWebp);
      }

      $('#node-input-outputFormat').on('change', updateQualityVisibility);
      updateQualityVisibility(); // Initial call

      /* Debug visibility logic */
      function updateDebugWidthVisibility() {
        if ($('#node-input-debugEnabled').is(':checked')) {
          $('#debug-width-row').show();
        } else {
          $('#debug-width-row').hide();
        }
      }

      $('#node-input-debugEnabled').on('change', updateDebugWidthVisibility);
      updateDebugWidthVisibility(); // Initial call
    }
  });
</script>

<!-- 3 ▸ Help documentation -->
<script type="text/html" data-help-name="rp-cropBB">
  <p>Extracts image crops from bounding boxes detected by inference models.</p>
  
  <h3>Details</h3>
  <p>This node takes images and their corresponding bounding box data (typically from an inferencer node)
  and extracts each detected region as a separate image crop. Each crop is paired with its detection metadata.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>Image Input<span class="property-type">image | image[]</span></dt>
    <dd>Single image or array of images in standard Rosepetal format</dd>

    <dt>Bounding Boxes<span class="property-type">array</span></dt>
    <dd>Array of detection objects with format: <code>[{raw_boxes: [[x1,y1],...], tag: "label", confidence: 0.95}, ...]</code></dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>crops<span class="property-type">array</span></dt>
    <dd>Array of image objects with metadata. Each element is directly usable as an image with added <code>tag</code>, <code>confidence</code>, and <code>bbox</code> properties.</dd>
  </dl>
  
  <h3>Configuration</h3>
  <dl class="message-properties">
    <dt>Image Input</dt>
    <dd>Path to image data (default: <code>msg.image</code>)</dd>

    <dt>Bounding Boxes</dt>
    <dd>Path to inference results (default: <code>msg.default</code>)</dd>
    
    <dt>Output Format</dt>
    <dd>Raw (fastest), JPEG, PNG, or WebP encoding</dd>
    
    <dt>Min Confidence</dt>
    <dd>Filter out detections below this confidence threshold (0.0-1.0)</dd>
    
    <dt>Debug</dt>
    <dd>Enable debug image display in Node-RED editor</dd>
  </dl>
  
  <h3>Example Input (Bounding Boxes)</h3>
  <pre>[
  {
    "raw_boxes": [[0.1, 0.2], [0.4, 0.2], [0.4, 0.6], [0.1, 0.6]],
    "tag": "mountain",
    "confidence": 0.98095703125
  },
  {
    "raw_boxes": [[0.5, 0.1], [0.9, 0.1], [0.9, 0.4], [0.5, 0.4]],
    "tag": "sky",
    "confidence": 0.92
  }
]</pre>

  <h3>Example Output</h3>
  <pre>[
  {
    data: Buffer,           // Crop image data
    width: 150,
    height: 200,
    channels: 3,
    colorSpace: "RGB",
    dtype: "uint8",
    tag: "mountain",        // Detection label
    confidence: 0.98,       // Detection confidence
    bbox: {                 // Crop coordinates in pixels
      x: 100, y: 50, width: 150, height: 200,
      normalized: {x1: 0.1, y1: 0.2, x2: 0.4, y2: 0.6}
    }
  },
  {
    data: Buffer,
    width: 80,
    height: 120,
    channels: 3,
    colorSpace: "RGB",
    dtype: "uint8",
    tag: "sky",
    confidence: 0.92,
    bbox: {
      x: 300, y: 200, width: 80, height: 120,
      normalized: {x1: 0.5, y1: 0.1, x2: 0.9, y2: 0.4}
    }
  }
]</pre>

  <h3>Usage</h3>
  <p>Each array element can be directly used as an image input to other nodes:</p>
  <pre>// Access first crop directly
msg.payload[0]  // {data, width, height, channels, colorSpace, tag, confidence, bbox}

// Use in image-out node
msg.payload = crops[0];  // No need for crops[0].crop

// Filter by tag
const mountains = crops.filter(c => c.tag === "mountain");

// Sort by confidence
crops.sort((a, b) => b.confidence - a.confidence);</pre>
  
  <h3>Performance</h3>
  <p>Uses optimized C++ backend for fast crop extraction. Multiple crops are processed in parallel for best performance.</p>
</script>
