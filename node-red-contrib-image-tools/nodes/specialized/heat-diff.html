<script type="text/javascript">
    RED.nodes.registerType('rp-heat-diff',{
      category:'RP Image',
      color:'#FF6B6B',
      icon:'font-awesome/fa-fire',
      defaults:{
        name:{value:""},
        image1Path:{value:"payload"}, image1PathType:{value:"msg"},
        image2Path:{value:"goldenImage"}, image2PathType:{value:"msg"},
        outputPath:{value:"payload"},outputPathType:{value:"msg"},
        outputFormat:{value:"raw"},
        outputQuality:{value:90},
        pngOptimize:{value:false},
        webpLossless:{value:false},
        webpSmartSubsample:{value:false},
        webpEffort:{value:""},
        debugEnabled:{value:false},
        debugWidth:{value:200},
        debugWidthType:{value:"num"},
        colormap:{value:"JET"},
        blurSize:{value:0}, blurSizeType:{value:"num"},
        threshold:{value:0}, thresholdType:{value:"num"},
        statsEnabled:{value:true},
        statsPath:{value:"diffStats"}, statsPathType:{value:"msg"}
      },
      inputs:1,outputs:1,
      label:function(){return this.name||"rp-heat-diff";},
      oneditprepare:function(){
        $("#node-input-image1Path").typedInput({
          default:'msg',types:['msg','flow','global'],
          typeField:"#node-input-image1PathType"});
        $("#node-input-image2Path").typedInput({
          default:'msg',types:['msg','flow','global'],
          typeField:"#node-input-image2PathType"});
        $("#node-input-outputPath").typedInput({
          default:'msg',types:['msg','flow','global'],
          typeField:"#node-input-outputPathType"});
        $("#node-input-statsPath").typedInput({
          default:'msg',types:['msg','flow','global'],
          typeField:"#node-input-statsPathType"});

        // Stats path only relevant when stats are enabled
        var statsCheckbox = $('#node-input-statsEnabled');
        function updateStatsPathVisibility(){
          $("#stats-path-row").toggle(statsCheckbox.is(':checked'));
        }
        statsCheckbox.on('change', updateStatsPathVisibility);
        updateStatsPathVisibility();

        $("#node-input-blurSize").typedInput({
          default:'num',types:['num','msg','flow','global'],
          typeField:"#node-input-blurSizeType"});
        $("#node-input-threshold").typedInput({
          default:'num',types:['num','msg','flow','global'],
          typeField:"#node-input-thresholdType"});

        // Output format visibility
        function updateQualityVisibility(){
          var format = $("#node-input-outputFormat").val();
          $("#quality-row").toggle(format === "jpg" || format === "webp");
          $("#png-optimize-row").toggle(format === "png");
          var isWebp = format === 'webp';
          $("#webp-lossless-row").toggle(isWebp);
          $("#webp-smartsubsample-row").toggle(isWebp);
          $("#webp-effort-row").toggle(isWebp);
        }
        $("#node-input-outputFormat").on("change", updateQualityVisibility);
        updateQualityVisibility();

        // Debug display
        var debugCheckbox = $('#node-input-debugEnabled');
        var debugWidthRow = $('#debug-width-row');
        $("#node-input-debugWidth").typedInput({
            default: 'num',
            types: ['num', 'msg', 'flow', 'global'],
            typeField: "#node-input-debugWidthType"
        });
        function updateDebugWidthVisibility() {
            debugWidthRow.toggle(debugCheckbox.is(':checked'));
        }
        updateDebugWidthVisibility();
        debugCheckbox.on('change', updateDebugWidthVisibility);
      }
    });
</script>

<script type="text/x-red" data-help-name="rp-heat-diff">
  <p><b>rosepetal-heat-diff</b> computes the absolute pixel difference between two images and visualizes the result as a color-mapped heat image. Useful for comparing a scanned image against a golden reference after alignment.</p>

  <h3>Details</h3>
  <p>Both input images are converted to grayscale, then the per-pixel absolute difference is computed. The difference map is passed through a configurable colormap to produce a heat visualization where brighter/warmer colors indicate larger differences.</p>

  <h3>Properties</h3>
  <dl class="message-properties">
    <dt>Image 1 <span class="property-type">string</span></dt>
    <dd>Path to the first image (e.g. the scanned/test image).</dd>

    <dt>Image 2 <span class="property-type">string</span></dt>
    <dd>Path to the second image (e.g. the golden/reference image).</dd>

    <dt>Output to <span class="property-type">string</span></dt>
    <dd>Message property where the heat map image will be stored.</dd>

    <dt>Colormap <span class="property-type">string</span></dt>
    <dd>Color mapping applied to the difference: JET, HOT, INFERNO, TURBO, BONE, COOL, RAINBOW, OCEAN, PINK, HSV.</dd>

    <dt>Blur <span class="property-type">number | msg | flow | global</span></dt>
    <dd>Gaussian blur kernel size applied to the difference before colormapping. Smooths noise. 0 to disable. Can be a fixed number or resolved from a msg/flow/global property per message.</dd>

    <dt>Threshold <span class="property-type">number | msg | flow | global</span></dt>
    <dd>Pixel differences below this value (0-255) are set to zero before colormapping. Suppresses minor noise. Also defines which pixels count as "changed" for the statistics. Can be a fixed number or resolved from a msg/flow/global property per message.</dd>

    <dt>Statistics <span class="property-type">boolean</span></dt>
    <dd>When enabled (default), numeric diff statistics are computed.</dd>

    <dt>Stats to <span class="property-type">string</span></dt>
    <dd>Message property where the statistics object is stored. Default <code>msg.diffStats</code>.</dd>
  </dl>

  <h3>Inputs</h3>
  <p>Two images in the standard format (raw image object or encoded buffer), or two arrays of images of the same length — images are paired by index and one heat map is produced per pair. Mixing a single image with an array, or arrays of different lengths, raises an error. Images of different sizes are resized to match the larger one.</p>

  <h3>Outputs</h3>
  <p>A 3-channel BGR heat map image in the selected output format. If the inputs were arrays, the output is an array of heat maps in the same order.</p>
  <p>When Statistics is enabled, the configured stats property (default <code>msg.diffStats</code>) holds an object (or array, matching the input shape) with:</p>
  <dl class="message-properties">
    <dt>validRatio <span class="property-type">number</span></dt>
    <dd>Fraction of pixels used for statistics. Pixels that are pure black in either input (alignment borders, composite padding) are excluded from all stats.</dd>
    <dt>changedRatio <span class="property-type">number</span></dt>
    <dd>Fraction of valid pixels whose difference exceeds the threshold.</dd>
    <dt>meanDiff / maxDiff / p50 / p95 / p99 <span class="property-type">number</span></dt>
    <dd>Mean, maximum and percentiles of the difference values (0-255) over valid pixels.</dd>
    <dt>rmse / psnr / ssim <span class="property-type">number</span></dt>
    <dd>Root-mean-square error, peak signal-to-noise ratio (dB, 100 = identical) and structural similarity (0-1, 1 = identical).</dd>
    <dt>blobCount / largestBlobArea / blobs <span class="property-type">number | array</span></dt>
    <dd>Connected regions of changed pixels. <code>blobs</code> lists up to 50 regions, largest first, each with <code>x, y, w, h, area, cx, cy</code> in output-image coordinates.</dd>
  </dl>
</script>
