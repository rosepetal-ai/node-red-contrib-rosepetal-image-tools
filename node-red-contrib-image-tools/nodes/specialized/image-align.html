<script type="text/javascript">
    RED.nodes.registerType('rp-image-align', {
        category: 'RP Image',
        color: '#DDA0DD',
        defaults: {
            name: { value: "" },
            // Image path configurations (like blend node)
            referenceImagePath: { value: "payload.reference" },
            referenceImagePathType: { value: "msg" },
            targetImagePath: { value: "payload.target" },
            targetImagePathType: { value: "msg" },
            outputPath: { value: "payload" },
            outputPathType: { value: "msg" },
            outputFormat: { value: "raw" },
            outputQuality: { value: 90 },
            pngOptimize: { value: false },
            webpLossless: { value: false },
            webpSmartSubsample: { value: false },
            webpEffort: { value: "" },
            // Debug configuration
            debugEnabled: { value: false },
            debugWidth: { value: 200 },
            debugWidthType: { value: "num" },
            // Alignment configuration
            preset: { value: "ultra-fast" },
            // Motion model used by the alignment algorithm(s). Default for NEW
            // nodes is "affine" (handles translation + rotation + anisotropic
            // scale + shear); existing saved flows that lack this field fall
            // back to "translation" in image-align.js for full backward
            // compatibility.
            motionModel: { value: "affine" },
            // Pipeline: which alignment algorithm(s) to run.
            //   ecc           - intensity-only ECC, identity init (legacy)
            //   features      - ORB+RANSAC only, fast and robust
            //   features+ecc  - ORB seed -> ECC refinement (best accuracy)
            // New nodes default to features+ecc; existing saved flows fall
            // back to ecc in image-align.js for full backward compatibility.
            pipeline: { value: "features+ecc" },
            // ECC refinement policy when pipeline=features+ecc:
            //   always - run ECC every call (legacy default, preserves accuracy)
            //   auto   - skip ECC when ORB seed has high RANSAC inlier count
            //            (>=50). Big speedup on clean feature-rich data.
            //   never  - never run ECC (equivalent to pipeline=features)
            // Default 'always' for back-compat. Existing saved flows use 'always'.
            eccRefine: { value: "always" },
            // Feature detector for the seed stage (features / features+ecc):
            //   orb  - binary descriptors, fastest (default)
            //   sift - float descriptors, more robust on low-texture/blurry
            //          images, ~2-4x slower
            detector: { value: "orb" },
            returnMatrix: { value: false },
            transformPolygon: { value: false },
            polygonPath: { value: "payload.polygon" },
            polygonPathType: { value: "msg" },
            // Custom parameters
            customScale: { value: 0.2 },
            customScaleType: { value: "num" },
            customMaxIterations: { value: 10 },
            customMaxIterationsType: { value: "num" },
            customTerminationEps: { value: 0.1 },
            customTerminationEpsType: { value: "num" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-crosshairs",
        label: function() {
            if (this.name) { return this.name; }
            return `align (${this.preset})`;
        },
        oneditprepare: function() {
            /* path typedInputs */
            $("#node-input-referenceImagePath").typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: "#node-input-referenceImagePathType"
            });
            $("#node-input-targetImagePath").typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: "#node-input-targetImagePathType"
            });
            $("#node-input-outputPath").typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: "#node-input-outputPathType"
            });
            $("#node-input-polygonPath").typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: "#node-input-polygonPathType"
            });

            // Initialize debug width TypedInput
            $("#node-input-debugWidth").typedInput({
                default: 'num',
                types: ['num', 'msg', 'flow', 'global'],
                typeField: "#node-input-debugWidthType"
            });

            // Initialize custom parameter TypedInputs
            $("#node-input-customScale").typedInput({
                default: 'num',
                types: ['num', 'msg', 'flow', 'global'],
                typeField: "#node-input-customScaleType"
            });
            $("#node-input-customMaxIterations").typedInput({
                default: 'num',
                types: ['num', 'msg', 'flow', 'global'],
                typeField: "#node-input-customMaxIterationsType"
            });
            $("#node-input-customTerminationEps").typedInput({
                default: 'num',
                types: ['num', 'msg', 'flow', 'global'],
                typeField: "#node-input-customTerminationEpsType"
            });

            // Output Format Logic
            function updateQualityVisibility() {
                const format = $('#node-input-outputFormat').val();
                if (format === 'jpg' || format === 'webp') {
                    $('#quality-row').show();
                } else {
                    $('#quality-row').hide();
                }

                if (format === 'png') {
                    $('#png-optimize-row').show();
                } else {
                    $('#png-optimize-row').hide();
                }
                // Show WebP advanced options only when WebP is selected
                const isWebp = format === 'webp';
                $('#webp-lossless-row').toggle(isWebp);
                $('#webp-smartsubsample-row').toggle(isWebp);
                $('#webp-effort-row').toggle(isWebp);
            }

            $('#node-input-outputFormat').on('change', updateQualityVisibility);
            updateQualityVisibility();

            // Debug Display Logic
            const debugCheckbox = $('#node-input-debugEnabled');
            const debugWidthRow = $('#debug-width-row');
            
            function updateDebugWidthVisibility() {
                if (debugCheckbox.is(':checked')) {
                    debugWidthRow.show();
                } else {
                    debugWidthRow.hide();
                }
            }
            
            updateDebugWidthVisibility();
            debugCheckbox.on('change', updateDebugWidthVisibility);

            // Transform Polygon Logic
            const transformPolygonCheckbox = $('#node-input-transformPolygon');
            const polygonPathRow = $('#polygon-path-row');
            
            function updatePolygonPathVisibility() {
                if (transformPolygonCheckbox.is(':checked')) {
                    polygonPathRow.show();
                } else {
                    polygonPathRow.hide();
                }
            }
            
            updatePolygonPathVisibility();
            transformPolygonCheckbox.on('change', updatePolygonPathVisibility);

            // Preset description and custom parameters visibility
            function updatePresetDescription() {
                const preset = $('#node-input-preset').val();
                let description = '';
                const customParams = $('#custom-parameters');
                
                switch(preset) {
                    case 'ultra-fast':
                        description = 'Maximum speed, basic accuracy (scale: 0.2, iter: 10)';
                        customParams.hide();
                        break;
                    case 'fast':
                        description = 'Good speed, decent accuracy (scale: 0.3, iter: 20)';
                        customParams.hide();
                        break;
                    case 'balanced':
                        description = 'Balanced speed and accuracy (scale: 0.5, iter: 30)';
                        customParams.hide();
                        break;
                    case 'quality':
                        description = 'Best accuracy, slower processing (scale: 0.7, iter: 50)';
                        customParams.hide();
                        break;
                    case 'custom':
                        description = 'Custom parameters - configure scale, iterations, and convergence';
                        customParams.show();
                        break;
                }
                
                $('#preset-description').text(description);
            }
            
            $('#node-input-preset').on('change', updatePresetDescription);
            updatePresetDescription();

            // Pipeline description + ECC Refine row visibility
            function updatePipelineDescription() {
                const pipeline = $('#node-input-pipeline').val();
                let description = '';
                switch (pipeline) {
                    case 'ecc':
                        description = 'Intensity-based ECC only. Fast for small misalignments; diverges if golden and scan are far apart.';
                        break;
                    case 'features':
                        description = 'ORB feature matching + RANSAC. Robust to large misalignments; no sub-pixel refinement.';
                        break;
                    case 'features+ecc':
                        description = 'ORB seeds an ECC refinement pass. Most accurate; recommended default.';
                        break;
                }
                $('#pipeline-description').text(description);
                // ECC Refine policy is only meaningful when ECC actually runs
                $('#ecc-refine-row').toggle(pipeline === 'features+ecc');
                $('#ecc-refine-description').toggle(pipeline === 'features+ecc');
                // Detector is only used by the feature-seed stage
                $('#detector-row').toggle(pipeline !== 'ecc');
                $('#detector-description').toggle(pipeline !== 'ecc');
            }

            $('#node-input-pipeline').on('change', updatePipelineDescription);
            updatePipelineDescription();

            // Detector description
            function updateDetectorDescription() {
                const detector = $('#node-input-detector').val();
                let description = '';
                switch (detector) {
                    case 'orb':
                        description = 'ORB: binary descriptors, fastest. Good default for textured industrial images.';
                        break;
                    case 'sift':
                        description = 'SIFT: float descriptors, more robust on low-texture, blurry, or scale-changed images. ~2-4x slower than ORB.';
                        break;
                }
                $('#detector-description').text(description);
            }

            $('#node-input-detector').on('change', updateDetectorDescription);
            updateDetectorDescription();

            // ECC Refine description
            function updateEccRefineDescription() {
                const eccRefine = $('#node-input-eccRefine').val();
                let description = '';
                switch (eccRefine) {
                    case 'always':
                        description = 'Always run ECC refinement (legacy default, most accurate).';
                        break;
                    case 'auto':
                        description = 'Skip ECC when ORB seed has 50+ RANSAC inliers. Big speedup on clean feature-rich data with ~5% accuracy loss in edge cases.';
                        break;
                    case 'never':
                        description = 'Never run ECC. Equivalent to pipeline=features but keeps the features+ecc mode in saved config.';
                        break;
                }
                $('#ecc-refine-description').text(description);
            }

            $('#node-input-eccRefine').on('change', updateEccRefineDescription);
            updateEccRefineDescription();

            // Motion Model description
            function updateMotionModelDescription() {
                const motionModel = $('#node-input-motionModel').val();
                let description = '';
                switch (motionModel) {
                    case 'translation':
                        description = 'Pure x/y shift (fastest, 2 DoF). Use when scans only translate.';
                        break;
                    case 'euclidean':
                        description = 'Translation + rotation (3 DoF). Use for rigid in-plane rotation.';
                        break;
                    case 'affine':
                        description = 'Translation + rotation + anisotropic scale + shear (6 DoF). Best general default for printed labels and documents.';
                        break;
                    case 'homography':
                        description = 'Full perspective transform (8 DoF). Use only if you have real perspective distortion; slowest to converge.';
                        break;
                }
                $('#motion-model-description').text(description);
            }

            $('#node-input-motionModel').on('change', updateMotionModelDescription);
            updateMotionModelDescription();
        }
    });

    // Debug image display renderer (shared)
    if (!window.debugImageRendererInitialized) {
        window.debugImageRendererInitialized = true;
        
        (function() {
            var isSubscribed = false;
            
            function subscribeToDebugImages() {
                if (isSubscribed || typeof RED === 'undefined' || !RED.comms) return;
                isSubscribed = true;
                
                RED.comms.subscribe('debug-image', function(event, data) {
                    if (!data || !data.id) return;
                    
                    try {
                        renderDebugImage(data);
                    } catch (err) {
                        console.warn('Debug image render error:', err);
                    }
                });
            }
            
            function renderDebugImage(data) {
                const nodeId = data.id;
                const base64Data = data.data;
                const format = data.format || 'unknown';
                const mimeType = data.mimeType || 'jpeg';
                
                if (!base64Data) {
                    removeDebugImage(nodeId);
                    return;
                }
                
                const nodeElement = document.getElementById(nodeId);
                if (!nodeElement) return;
                
                const debugWidth = data.debugWidth || 200;
                const debugHeight = data.debugHeight || 200;
                const maxDisplayWidth = Math.min(debugWidth, 500);
                const displayHeight = debugHeight * (maxDisplayWidth / debugWidth);
                
                let debugContainer = document.getElementById('debug-img-container-' + nodeId);
                
                if (!debugContainer) {
                    debugContainer = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
                    debugContainer.id = 'debug-img-container-' + nodeId;
                    debugContainer.setAttribute('x', '0');
                    debugContainer.setAttribute('y', '45');
                    debugContainer.setAttribute('width', maxDisplayWidth.toString());
                    debugContainer.setAttribute('height', displayHeight.toString());
                    debugContainer.style.overflow = 'visible';
                    
                    const img = document.createElement('img');
                    img.id = 'debug-img-' + nodeId;
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.style.display = 'block';
                    img.style.cursor = 'pointer';
                    img.style.maxHeight = 'none';
                    img.style.maxWidth = 'none';
                    
                    img.onclick = function() {
                        removeDebugImage(nodeId);
                    };
                    
                    debugContainer.appendChild(img);
                    nodeElement.appendChild(debugContainer);
                } else {
                    debugContainer.setAttribute('width', maxDisplayWidth.toString());
                    debugContainer.setAttribute('height', displayHeight.toString());
                }
                
                const img = document.getElementById('debug-img-' + nodeId);
                if (img) {
                    img.src = `data:image/${mimeType};base64,${base64Data}`;
                    img.title = 'Debug aligned image (click to hide)';
                }
            }
            
            function removeDebugImage(nodeId) {
                const debugContainer = document.getElementById('debug-img-container-' + nodeId);
                if (debugContainer) {
                    debugContainer.remove();
                }
            }
            
            function initializeWhenReady() {
                if (typeof RED !== 'undefined' && RED.comms) {
                    subscribeToDebugImages();
                    
                    setInterval(function() {
                        const debugContainers = document.querySelectorAll('[id^="debug-img-container-"]');
                        debugContainers.forEach(container => {
                            const nodeId = container.id.replace('debug-img-container-', '');
                            const nodeElement = document.getElementById(nodeId);
                            if (!nodeElement) {
                                container.remove();
                            }
                        });
                    }, 5000);
                } else {
                    setTimeout(initializeWhenReady, 100);
                }
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializeWhenReady);
            } else {
                initializeWhenReady();
            }
        })();
    }
</script>

        <div class="form-row">

            <input type="hidden" id="node-input-customScaleType">
            <span style="margin-left: 10px; color: #666;">0.1-1.0 (image downscale factor)</span>
        </div>
        <div class="form-row">
            <label for="node-input-customMaxIterations"><i class="fa fa-repeat"></i> Max Iterations</label>
            <input type="text" id="node-input-customMaxIterations" style="width: 200px;">
            <input type="hidden" id="node-input-customMaxIterationsType">
            <span style="margin-left: 10px; color: #666;">1-200 (alignment iterations)</span>

        <div class="form-row">

    <div class="form-tips">
        <b>Flexible Paths:</b> Configure where to find reference and target images in your message.<br>
        <b>Default:</b> <code>msg.payload.reference</code> and <code>msg.payload.target</code><br>
        <b>Output:</b> Returns the aligned target image. Alignment info is added to <code>msg.alignment</code>.<br>
        <b>Transform Matrix:</b> When enabled, includes transformation matrix with <code>dx</code>, <code>dy</code> translation values, 2x3 OpenCV matrix, and 3x3 homogeneous matrix.<br>
        <b>Transform Polygon:</b> When enabled, transforms polygon coordinates using the same alignment transformation. Expects normalized coordinates (0-1 range) in the same format as add-mask node.
    </div>
</script>

<script type="text/x-red" data-help-name="rp-image-align">
  <p>Aligns images using ultra-fast ECC (Enhanced Correlation Coefficient) algorithm with OpenCV backend for maximum performance.</p>

  <h3>Details</h3>
  <p>This node performs image alignment by finding the transformation needed to align a target image with a reference image. It uses OpenCV's ECC algorithm optimized for speed with configurable precision levels. The aligned target image is returned as output. Both inputs may also be same-length arrays: images are paired by index, each pair is aligned independently, and the output is an array of aligned images.</p>

  <h3>Properties</h3>
  <dl class="message-properties">
    <dt>Reference Image <span class="property-type">string</span></dt>
    <dd>Path to reference image (or array of images) in message. Defaults to <code>msg.payload.reference</code>.</dd>
    <dt>Target Image <span class="property-type">string</span></dt>
    <dd>Path to target image (or array of images) in message. Defaults to <code>msg.payload.target</code>.</dd>
    <dt>Output to <span class="property-type">string</span></dt>
    <dd>Location where aligned image will be stored. Defaults to <code>msg.payload</code>.</dd>
    <dt>Output Format <span class="property-type">string</span></dt>
    <dd>Output format: <code>raw</code> (fastest), <code>jpg</code>, <code>png</code>, or <code>webp</code>.</dd>
    <dt>Pipeline <span class="property-type">string</span></dt>
    <dd>Which alignment algorithm(s) to run:
      <ul>
        <li><code>ecc</code> &mdash; intensity-based ECC only, identity init. Legacy behavior. Fast for small misalignments but diverges when golden and scan are far apart.</li>
        <li><code>features</code> &mdash; ORB+RANSAC feature matching only. Robust to large misalignments and rotation/scale; no sub-pixel refinement.</li>
        <li><code>features+ecc</code> &mdash; ORB result seeds an ECC refinement pass. Best accuracy. Recommended default for new nodes.</li>
      </ul>
      New nodes default to <code>features+ecc</code>; existing saved flows that lack this field fall back to <code>ecc</code> for full backward compatibility. If ECC diverges after a successful feature seed, the seed itself is returned (rather than failing the alignment).
    </dd>
    <dt>Detector <span class="property-type">string</span></dt>
    <dd>Feature detector used by the seed stage (pipelines <code>features</code> and <code>features+ecc</code>):
      <ul>
        <li><code>orb</code> &mdash; binary descriptors, fastest. Good default for textured industrial images. Legacy behavior.</li>
        <li><code>sift</code> &mdash; float descriptors, more robust on low-texture, blurry, or scale-changed images; roughly 2-4x slower than ORB.</li>
      </ul>
      Ignored when Pipeline is <code>ecc</code>. Default <code>orb</code>.
    </dd>
    <dt>ECC Refine <span class="property-type">string</span></dt>
    <dd>Only used when Pipeline is <code>features+ecc</code>. Controls whether ECC's slow iterative refinement actually runs after the ORB seed:
      <ul>
        <li><code>always</code> &mdash; run ECC every call. Most accurate. Legacy default.</li>
        <li><code>auto</code> &mdash; skip ECC when the ORB seed has 50+ RANSAC inliers (high confidence). On clean feature-rich data this can save 30-200ms per call with negligible accuracy impact. ECC still runs when features are weak.</li>
        <li><code>never</code> &mdash; never run ECC. Equivalent to <code>pipeline=features</code> but keeps the features+ecc mode in the saved config for easy toggling.</li>
      </ul>
      Default <code>always</code> for new nodes and back-compat with existing saved flows.
    </dd>
    <dt>Motion Model <span class="property-type">string</span></dt>
    <dd>Geometric transform shape that the chosen pipeline is allowed to recover. One of <code>translation</code> (2 DoF), <code>euclidean</code> (3 DoF, +rotation), <code>affine</code> (6 DoF, +anisotropic scale + shear), or <code>homography</code> (8 DoF, full perspective). Default for new nodes is <code>affine</code>; existing saved flows that lack this field continue to use <code>translation</code> for full backward compatibility.</dd>
    <dt>Speed Preset <span class="property-type">string</span></dt>
    <dd>Alignment speed/quality balance: <code>ultra-fast</code>, <code>fast</code>, <code>balanced</code>, or <code>quality</code>. Higher-DoF motion models (affine, homography) may benefit from <code>balanced</code> or <code>quality</code> presets if you observe convergence issues.</dd>
    <dt>Transform Polygon <span class="property-type">boolean</span></dt>
    <dd>When enabled, transforms polygon coordinates from the specified path using the alignment transformation.</dd>
    <dt>Polygon Path <span class="property-type">string</span></dt>
    <dd>Path to polygon coordinates in message. Expected format: array of [x, y] pairs with normalized values (0-1 range).</dd>
  </dl>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>Images <span class="property-type">object | array</span></dt>
    <dd>Both images must be in standard format: <code>{data: Buffer, width: number, height: number, channels: number, colorSpace: string}</code>. Images can be located anywhere in the message using the configurable paths. Reference and target must have the same shape: two single images, or two non-empty arrays of equal length (paired by index).</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | array | Buffer</span></dt>
    <dd>Aligned target image in specified output format. Array in, array out: with array inputs this is an array of aligned images, and per-pair alignment fields (<code>success</code> aggregated with AND, <code>transformMatrix</code>, transformed polygons) become arrays in <code>msg.alignment</code>.</dd>
    <dt>alignment <span class="property-type">object</span></dt>
    <dd>Alignment information:
      <ul>
        <li><code>success</code>: boolean indicating alignment success</li>
        <li><code>timing</code>: processing timing breakdown</li>
        <li><code>preset</code>: speed preset used</li>
        <li><code>pipeline</code>: pipeline used (<code>ecc</code>, <code>features</code>, or <code>features+ecc</code>)</li>
        <li><code>eccRefine</code>: ECC refinement policy used (<code>always</code>, <code>auto</code>, or <code>never</code>)</li>
        <li><code>detector</code>: feature detector used (<code>orb</code> or <code>sift</code>)</li>
        <li><code>motionModel</code>: motion model used (<code>translation</code>, <code>euclidean</code>, <code>affine</code>, or <code>homography</code>)</li>
        <li><code>transformMatrix</code>: (optional) transformation matrix when enabled:
          <ul>
            <li><code>dx</code>: horizontal translation in pixels</li>
            <li><code>dy</code>: vertical translation in pixels</li>
            <li><code>matrix2x3</code>: OpenCV 2x3 matrix format [a, b, dx, c, d, dy] (upper rows for homography)</li>
            <li><code>matrix3x3</code>: 3x3 homogeneous matrix - canonical [a,b,dx,c,d,dy,0,0,1] for affine-family, full perspective matrix for homography</li>
            <li><code>transform</code>: alias for matrix3x3 (backward compatibility)</li>
            <li><code>motionModel</code>: copy of the motion model string for introspection</li>
          </ul>
        </li>
        <li><code>originalPolygon</code>: (optional) original polygon coordinates when Transform Polygon is enabled</li>
        <li><code>transformedPolygon</code>: (optional) transformed polygon coordinates in same normalized format (0-1 range)</li>
      </ul>
    </dd>
  </dl>

  <h3>Speed Presets</h3>
  <ul>
    <li><strong>Ultra Fast:</strong> Maximum speed, basic accuracy (scale: 0.2, iterations: 10)</li>
    <li><strong>Fast:</strong> Good speed, decent accuracy (scale: 0.3, iterations: 20)</li>
    <li><strong>Balanced:</strong> Balanced speed and accuracy (scale: 0.5, iterations: 30)</li>
    <li><strong>Quality:</strong> Best accuracy, slower processing (scale: 0.7, iterations: 50)</li>
    <li><strong>Custom:</strong> Manual parameter control:
      <ul>
        <li><code>Scale</code>: Image downscale factor (0.1-1.0) - smaller values = faster processing</li>
        <li><code>Max Iterations</code>: Maximum alignment iterations (1-200) - more iterations = better accuracy</li>
        <li><code>Termination Eps</code>: Convergence threshold (0.000001-0.1) - smaller values = stricter convergence</li>
      </ul>
    </li>
  </ul>

  <h3>Algorithm Details</h3>
  <p>Two complementary alignment families are available, selectable via the Pipeline dropdown:</p>
  <ul>
    <li><strong>Feature-based</strong> (ORB + RANSAC): detects keypoints in both images, matches descriptors with brute-force Hamming + Lowe's ratio test, then runs RANSAC to fit the chosen motion model. Robust to large displacements, rotations, and scale changes. Routes to <code>cv::estimateAffinePartial2D</code> (translation/euclidean), <code>cv::estimateAffine2D</code> (affine), or <code>cv::findHomography</code> (homography).</li>
    <li><strong>Intensity-based</strong> (<code>cv::findTransformECC</code>): iterative pixel-wise optimization. Sub-pixel accurate but a local optimizer &mdash; needs a good initial guess. Routes to <code>cv::MOTION_TRANSLATION</code> / <code>EUCLIDEAN</code> / <code>AFFINE</code> / <code>HOMOGRAPHY</code> depending on the motion model.</li>
  </ul>
  <p>The two are combined in <code>features+ecc</code>: ORB+RANSAC produces a coarse seed, then ECC refines it from that initial guess. If ECC diverges after the seed, the feature result is returned rather than failing the alignment.</p>
  <ul>
    <li>Images are downscaled for speed (configurable scale factor); both feature detection and ECC refinement run on the same downscaled grid, and the resulting matrix is rescaled to full resolution at the end.</li>
    <li>Affine-family models are warped via <code>cv::warpAffine</code>; homography uses <code>cv::warpPerspective</code>.</li>
    <li>Target image dimensions are adjusted to match reference before alignment.</li>
    <li>Polygon coordinates are remapped through the inverse warp using <code>cv::transform</code> (affine) or <code>cv::perspectiveTransform</code> (homography).</li>
  </ul>

  <h3>Flexible Input Configuration</h3>
  <p>Configure where to find images in your message using the path settings:</p>
  <ul>
    <li><strong>Default:</strong> <code>msg.payload.reference</code> and <code>msg.payload.target</code></li>
    <li><strong>Custom paths:</strong> <code>msg.referenceImage</code> and <code>msg.targetToAlign</code></li>
    <li><strong>Flow context:</strong> <code>flow.template</code> and <code>msg.sample</code></li>
    <li><strong>Global context:</strong> <code>global.baseImage</code> and <code>msg.testImage</code></li>
  </ul>

  <h3>Usage Examples</h3>
  <pre><code>// Default structure (payload.reference & payload.target)
msg.payload = {
  reference: { data: Buffer, width: 800, height: 600, channels: 3, colorSpace: "BGR" },
  target: { data: Buffer, width: 800, height: 600, channels: 3, colorSpace: "BGR" }
};

// Custom paths (configure: referenceImage & targetImage)
msg.referenceImage = { data: Buffer, width: 800, height: 600, channels: 3, colorSpace: "BGR" };
msg.targetImage = { data: Buffer, width: 800, height: 600, channels: 3, colorSpace: "BGR" };

// Mixed sources (configure: flow.template & payload)
flow.set("template", referenceImageObject);
msg.payload = targetImageObject;</code></pre>

  <h3>Common Workflows</h3>
  <ul>
    <li><strong>Quality Control:</strong> Image-in → Image-align → comparison analysis</li>
    <li><strong>Template Matching:</strong> Template + samples → Image-align → feature extraction</li>
    <li><strong>Multi-camera Calibration:</strong> Reference view + other views → Image-align → unified coordinate system</li>
  </ul>

  <h3>Performance</h3>
  <p>Optimized for real-time processing with sub-50ms typical processing times. Uses downscaled alignment for speed while maintaining accuracy for most use cases.</p>

  <h3>Error Handling</h3>
  <p>If alignment fails, the target image is resized to match reference dimensions and returned. Check <code>msg.alignment.success</code> for alignment status.</p>
