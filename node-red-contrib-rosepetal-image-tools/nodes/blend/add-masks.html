<script type="text/javascript">
    RED.nodes.registerType('add-masks',{
      category:'RP Image',
      color:'#DDA0DD',
      icon:'font-awesome/fa-masks',
      defaults:{
        name:{value:""},
        imagePath:{value:"payload.image"}, imagePathType:{value:"msg"},
        masksPath:{value:"payload"}, masksPathType:{value:"msg"},
        outputPath:{value:"payload"},outputPathType:{value:"msg"},
        outputFormat:{value:"raw"},
        outputQuality:{value:90},
        pngOptimize:{value:false},
        // Debug configuration
        debugEnabled:{value:false},
        debugWidth:{value:200},
        debugWidthType:{value:"num"},
        globalMaskStrength:{value:50},              // 0-100%, default 50%
        classColorMappings:{value:[]}               // Array of {className, color} objects
      },
      inputs:1,outputs:1,
      label:function(){return this.name||"add-masks";},
      oneditprepare:function(){
        const node = this;
        let classMappingIndex = 0;

        /* path typedInputs */
        $("#node-input-imagePath").typedInput({
          default:'msg',types:['msg','flow','global'],
          typeField:"#node-input-imagePathType"});
        $("#node-input-masksPath").typedInput({
          default:'msg',types:['msg','flow','global'],
          typeField:"#node-input-masksPathType"});
        $("#node-input-outputPath").typedInput({
          default:'msg',types:['msg','flow','global'],
          typeField:"#node-input-outputPathType"});

        /* mask strength slider functionality */
        const $strengthSlider = $("#node-input-globalMaskStrength");
        const $strengthValue = $("#strength-value");
        const $strengthLabel = $("#strength-label");

        function updateStrengthDisplay() {
          const value = parseInt($strengthSlider.val());
          $strengthValue.text(value + "%");

          // Update label to show effect
          if (value === 0) {
            $strengthLabel.text("No mask effect - original image only");
          } else if (value === 100) {
            $strengthLabel.text("Full mask effect - maximum blending");
          } else if (value === 50) {
            $strengthLabel.text("Balanced mask application");
          } else {
            $strengthLabel.text(value + "% mask strength");
          }
        }

        $strengthSlider.on("input", updateStrengthDisplay);
        updateStrengthDisplay(); // initial state

        function updateQualityVisibility(){
          const format = $("#node-input-outputFormat").val();
          $("#quality-row").toggle(format === "jpg" || format === "webp");
          $("#png-optimize-row").toggle(format === "png");
        }
        $("#node-input-outputFormat").on("change", updateQualityVisibility);
        updateQualityVisibility(); // initial state

        // === Debug Display Logic ===
        const debugCheckbox = $('#node-input-debugEnabled');
        const debugWidthRow = $('#debug-width-row');

        // Initialize debug width TypedInput
        $("#node-input-debugWidth").typedInput({
            default: 'num',
            types: ['num', 'msg', 'flow', 'global'],
            typeField: "#node-input-debugWidthType"
        });

        // Function to toggle debug width visibility
        function updateDebugWidthVisibility() {
            if (debugCheckbox.is(':checked')) {
                debugWidthRow.show();
            } else {
                debugWidthRow.hide();
            }
        }

        // Initialize debug state on node open
        updateDebugWidthVisibility();

        // Handle debug checkbox changes
        debugCheckbox.on('change', function() {
            const enabled = this.checked;
            updateDebugWidthVisibility();
            // Store debug state for runtime access
            $('#node-input-debugEnabled').data('debug-enabled', enabled);
        });

        // === Dynamic Class Color Mapping Logic ===

        // Initialize class mappings from saved config
        function initializeClassMappings() {
          const mappings = node.classColorMappings || [];
          mappings.forEach(mapping => {
            addClassMappingRow(mapping.className, mapping.color);
          });

          if (mappings.length === 0) {
            addClassMappingRow(); // Add one empty row by default
          }
        }

        // Add new class mapping row
        function addClassMappingRow(className = '', color = '#ff0000') {
          const container = $('#class-mappings-container');
          const index = classMappingIndex++;

          const rowHtml = `
            <div class="class-mapping-row" data-index="${index}" style="margin-bottom: 10px; display: flex; align-items: center;">
              <input type="text" placeholder="Class name (e.g., dog)"
                     class="class-name-input" value="${className}"
                     style="width: 200px; margin-right: 10px;">
              <input type="color" class="class-color-input" value="${color}"
                     style="width: 60px; height: 30px; margin-right: 10px;">
              <button type="button" class="remove-class-mapping editor-button"
                      style="margin-right: 10px;">
                <i class="fa fa-trash"></i>
              </button>
              <span class="duplicate-warning" style="color: red; display: none; margin-right: 10px;">
                ⚠️ Duplicate
              </span>
              <span class="color-conflict-warning" style="color: orange; display: none;">
                ⚠️ Similar color
              </span>
            </div>
          `;

          container.append(rowHtml);
          updateEventHandlers();
          validateClassNames();
          validateColors();
        }

        // Remove class mapping row
        function removeClassMappingRow(index) {
          $(`.class-mapping-row[data-index="${index}"]`).remove();
          validateClassNames();
          validateColors();

          // Ensure at least one row exists
          if ($('.class-mapping-row').length === 0) {
            addClassMappingRow();
          }
        }

        // Update event handlers for dynamic elements
        function updateEventHandlers() {
          // Remove existing handlers to prevent duplicates
          $('.remove-class-mapping').off('click');
          $('.class-name-input').off('input');
          $('.class-color-input').off('change');

          // Add class mapping button
          $('#add-class-mapping').off('click').on('click', function() {
            addClassMappingRow();
          });

          // Remove class mapping button
          $('.remove-class-mapping').on('click', function() {
            const index = $(this).closest('.class-mapping-row').data('index');
            removeClassMappingRow(index);
          });

          // Class name validation
          $('.class-name-input').on('input', function() {
            validateClassNames();
          });

          // Color change validation
          $('.class-color-input').on('change', function() {
            validateColors();
          });
        }

        // Validate class names for duplicates
        function validateClassNames() {
          const classNames = [];
          const inputs = $('.class-name-input');

          inputs.each(function() {
            const value = $(this).val().trim();
            const row = $(this).closest('.class-mapping-row');
            const warning = row.find('.duplicate-warning');

            if (value && classNames.includes(value)) {
              warning.show();
            } else {
              warning.hide();
            }

            if (value) classNames.push(value);
          });
        }

        // Validate colors for conflicts (similar colors)
        function validateColors() {
          const colors = [];
          const inputs = $('.class-color-input');

          inputs.each(function() {
            const color = $(this).val();
            const row = $(this).closest('.class-mapping-row');
            const warning = row.find('.color-conflict-warning');

            // Check for similar colors (simplified RGB distance)
            const hasSimilar = colors.some(existingColor => {
              return calculateColorDistance(color, existingColor) < 50; // Threshold for "similar"
            });

            if (hasSimilar) {
              warning.show();
            } else {
              warning.hide();
            }

            colors.push(color);
          });
        }

        // Calculate simple RGB distance between two hex colors
        function calculateColorDistance(color1, color2) {
          const rgb1 = hexToRgb(color1);
          const rgb2 = hexToRgb(color2);

          if (!rgb1 || !rgb2) return 255; // Max distance for invalid colors

          return Math.sqrt(
            Math.pow(rgb1.r - rgb2.r, 2) +
            Math.pow(rgb1.g - rgb2.g, 2) +
            Math.pow(rgb1.b - rgb2.b, 2)
          );
        }

        function hexToRgb(hex) {
          const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
          } : null;
        }

        // Save configuration before closing
        function saveClassMappings() {
          const mappings = [];
          $('.class-mapping-row').each(function() {
            const className = $(this).find('.class-name-input').val().trim();
            const color = $(this).find('.class-color-input').val();

            if (className) { // Only save non-empty class names
              mappings.push({ className, color });
            }
          });

          node.classColorMappings = mappings;
        }


        // Initialize UI
        initializeClassMappings();
      },
      oneditsave: function() {
        // Save class color mappings when dialog is closed
        const mappings = [];
        $('.class-mapping-row').each(function() {
          const className = $(this).find('.class-name-input').val().trim();
          const color = $(this).find('.class-color-input').val();

          if (className) { // Only save non-empty class names
            mappings.push({ className, color });
          }
        });

        this.classColorMappings = mappings;
      }
    });

    // Debug image display renderer - shared across all image processing nodes
    if (!window.debugImageRendererInitialized) {
        window.debugImageRendererInitialized = true;

        (function() {
            var isSubscribed = false;

            function subscribeToDebugImages() {
                if (isSubscribed || typeof RED === 'undefined' || !RED.comms) return;
                isSubscribed = true;

                RED.comms.subscribe('debug-image', function(event, data) {
                    if (!data || !data.id) return;

                    try {
                        renderDebugImage(data);
                    } catch (err) {
                        console.warn('Debug image render error:', err);
                    }
                });
            }

            function renderDebugImage(data) {
                const nodeId = data.id;
                const base64Data = data.data;
                const format = data.format || 'unknown';
                const mimeType = data.mimeType || 'jpeg';

                if (!base64Data) {
                    removeDebugImage(nodeId);
                    return;
                }

                const nodeElement = document.getElementById(nodeId);
                if (!nodeElement) return;

                let debugContainer = document.getElementById('debug-img-container-' + nodeId);

                if (!debugContainer) {
                    // Create SVG foreignObject to embed HTML content in SVG
                    debugContainer = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
                    debugContainer.id = 'debug-img-container-' + nodeId;
                    debugContainer.setAttribute('x', '70');
                    debugContainer.setAttribute('y', '5');
                    debugContainer.setAttribute('width', '120');
                    debugContainer.setAttribute('height', '120');
                    debugContainer.style.overflow = 'visible';

                    // Create simple image directly inside foreignObject
                    const img = document.createElement('img');
                    img.id = 'debug-img-' + nodeId;
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.style.display = 'block';
                    img.style.cursor = 'pointer';
                    img.style.maxHeight = '100px';
                    img.style.maxWidth = '100px';

                    img.onclick = function() {
                        removeDebugImage(nodeId);
                    };

                    debugContainer.appendChild(img);
                    nodeElement.appendChild(debugContainer);
                }

                const img = document.getElementById('debug-img-' + nodeId);

                if (img) {
                    img.src = `data:image/${mimeType};base64,${base64Data}`;
                    img.title = 'Debug image (click to hide)';
                }
            }

            function removeDebugImage(nodeId) {
                const debugContainer = document.getElementById('debug-img-container-' + nodeId);
                if (debugContainer) {
                    debugContainer.remove();
                }
            }

            function initializeWhenReady() {
                if (typeof RED !== 'undefined' && RED.comms) {
                    subscribeToDebugImages();

                    // Clean up orphaned debug images periodically
                    setInterval(function() {
                        const debugContainers = document.querySelectorAll('[id^="debug-img-container-"]');
                        debugContainers.forEach(container => {
                            const nodeId = container.id.replace('debug-img-container-', '');
                            const nodeElement = document.getElementById(nodeId);
                            if (!nodeElement) {
                                container.remove();
                            }
                        });
                    }, 5000);
                } else {
                    setTimeout(initializeWhenReady, 100);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializeWhenReady);
            } else {
                initializeWhenReady();
            }
        })();
    }
</script>

  <div class="form-row">

    <div style="margin-top: 5px; font-size: 11px; color: #666;" id="strength-label">

    </div>

  <div class="form-row">

    <div style="margin-top: 10px;">
      <button type="button" id="add-class-mapping" class="editor-button">
        <i class="fa fa-plus"></i> Add Class Mapping
      </button>

    <div style="margin-top: 5px; font-size: 11px; color: #666;">

<script type="text/x-red" data-help-name="add-masks">
  <p><b>rosepetal-add-masks</b> applies multiple polygon-based masks to a base image using weighted blending with configurable mask strength and class-based color mapping. This node processes arrays of mask objects with automatic color assignment for different classes.</p>

  <h3>Details</h3>
  <p>This node performs high-performance multi-polygon-based blending using OpenCV. Binary masks are generated from polygon coordinates using OpenCV's fillPoly function, then applied to the base image as blending weights. Each mask can have a different color based on its class name. The polygon coordinates are expected to be normalized (0-1 range) and are automatically scaled to match the image dimensions.</p>

  <h3>Properties</h3>
  <dl class="message-properties">
    <dt>Image <span class="property-type">string</span></dt>
    <dd>Message property path containing the base image to which the masks will be applied. Supports <code>msg</code>, <code>flow</code>, or <code>global</code> context via TypedInput.</dd>

    <dt>Masks Array <span class="property-type">string</span></dt>
    <dd>Message property path containing the masks array. Expected structure: array of objects with <code>masks</code> property containing mask objects with <code>mask[0]</code> coordinates and <code>class_name</code>. Supports <code>msg</code>, <code>flow</code>, or <code>global</code> context via TypedInput.</dd>

    <dt>Output to <span class="property-type">string</span></dt>
    <dd>Message property path where the masked image will be stored. Supports <code>msg</code>, <code>flow</code>, or <code>global</code> context via TypedInput.</dd>

    <dt>Output Format <span class="property-type">string</span></dt>
    <dd>Format for the output image: <code>raw</code> (fastest), <code>jpg</code>, <code>png</code>, or <code>webp</code>.</dd>

    <dt>Quality <span class="property-type">number</span></dt>
    <dd>Compression quality (1-100) for JPEG and WebP formats. Only visible when JPG or WebP is selected.</dd>

    <dt>Global Mask Strength <span class="property-type">number</span></dt>
    <dd>Intensity of mask application from 0% to 100%. Controls how strongly all masks affect the final result.</dd>


    <dt>Class Color Mappings <span class="property-type">array</span></dt>
    <dd>Dynamic list of class name to color mappings. Each mapping defines a specific color for masks with that class name. Supports adding and removing mappings.</dd>
  </dl>

  <h3>Input Structure</h3>
  <p>The masks array should follow this exact structure:</p>
  <pre>[
  {
    "masks": [
      {
        "mask": [[[x,y], [x,y], ...]], // Note: coordinates are in mask[0]
        "class_name": "dog"
      }
    ]
  },
  {
    "masks": [
      {
        "mask": [[[x,y], [x,y], ...]],
        "class_name": "cat"
      },
      {
        "mask": [[[x,y], [x,y], ...]],
        "class_name": "zebra"
      }
    ]
  }
]</pre>

  <h3>Key Features</h3>
  <ul>
    <li><b>Dynamic Color Management:</b> Add/remove class color mappings with real-time validation</li>
    <li><b>Auto-Color Generation:</b> Consistent random colors for undefined classes using seeded generation</li>
    <li><b>Duplicate Detection:</b> Visual warnings for duplicate class names and similar colors</li>
    <li><b>Multi-Layer Blending:</b> Proper compositing of multiple masks with weight normalization</li>
    <li><b>Structure Validation:</b> Comprehensive validation of nested mask array structure</li>
  </ul>

  <h3>Color Management</h3>
  <p>Colors are assigned using this priority order:</p>
  <ol>
    <li><b>User-defined mapping:</b> Colors explicitly set in the class color mappings</li>
    <li><b>Auto-generated:</b> Seeded random colors for undefined classes</li>
    <li><b>Default fallback:</b> White color (#ffffff)</li>
  </ol>

  <h3>Performance</h3>
  <ul>
    <li><b>C++ Backend:</b> High-performance OpenCV implementation with SIMD optimizations</li>
    <li><b>Batch Processing:</b> Efficient handling of multiple masks in single operation</li>
    <li><b>Memory Efficient:</b> Optimized buffer handling and intermediate result reuse</li>
    <li><b>Weight Normalization:</b> Prevents over-saturation when masks overlap</li>
  </ul>
</script>
